<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xrml</title>
  </head>
  <body>
    <div id="chrome">
      <h1>xrml</h1>
      <p>Spatial UI as web components. Drag to look around, click a button.</p>
      <p id="log">nothing yet</p>
      <div class="dropdown mb-72">
  <div tabindex="0" role="button" class="btn m-1">
    Theme
    <svg
      width="12px"
      height="12px"
      class="inline-block h-2 w-2 fill-current opacity-60"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 2048 2048">
      <path d="M1799 349l242 241-1017 1017L7 590l242-241 775 775 775-775z"></path>
    </svg>
  </div>
  <ul tabindex="-1" class="dropdown-content bg-base-300 rounded-box z-1 w-52 p-2 shadow-2xl">
    <li>
      <input
        type="radio"
        name="theme-dropdown"
        class="theme-controller w-full btn btn-sm btn-block btn-ghost justify-start"
        aria-label="Default"
        value="default" />
    </li>
    <li>
      <input
        type="radio"
        name="theme-dropdown"
        class="theme-controller w-full btn btn-sm btn-block btn-ghost justify-start"
        aria-label="Retro"
        value="retro" />
    </li>
    <li>
      <input
        type="radio"
        name="theme-dropdown"
        class="theme-controller w-full btn btn-sm btn-block btn-ghost justify-start"
        aria-label="Cyberpunk"
        value="cyberpunk" />
    </li>
    <li>
      <input
        type="radio"
        name="theme-dropdown"
        class="theme-controller w-full btn btn-sm btn-block btn-ghost justify-start"
        aria-label="Valentine"
        value="valentine" />
    </li>
    <li>
      <input
        type="radio"
        name="theme-dropdown"
        class="theme-controller w-full btn btn-sm btn-block btn-ghost justify-start"
        aria-label="Aqua"
        value="aqua" />
    </li>
  </ul>
</div>
    </div>

    <xr-button
      class="bg-teal-500 hover:bg-teal-400 text-white p-4 rounded-lg text-lg"
      position="-0.42 1.62 -1.5"
      onclick="xrmlLog('teal')"
      >Click me</xr-button
    >

    <xr-button
      class="bg-slate-700 hover:bg-slate-600 text-slate-100 px-6 py-3 rounded-full"
      position="0.42 1.62 -1.5"
      onclick="xrmlLog('pill')"
      >Rounded full</xr-button
    >

    <xr-button
      class="bg-[#7c3aed] hover:bg-[#a78bfa] text-white p-3 rounded-2xl text-sm font-bold"
      position="-0.42 1.28 -1.5"
      rotation="0 12 0"
      onclick="xrmlLog('arbitrary colour')"
      >Arbitrary hex</xr-button
    >

    <xr-button
      class="bg-rose-500 hover:bg-rose-400 text-white px-5 py-4 rounded-4xl text-xl"
      position="0.42 1.28 -1.5"
      rotation="0 -12 0"
      onclick="xrmlLog('rose')"
      >Rotated</xr-button
    >

    <xr-button
      class="btn"
      position="0.72 1.28 -1.4"
      rotation="0 -12 0"
      onclick="xrmlLog('rose')"
      >DaisyUI</xr-button
    >

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
